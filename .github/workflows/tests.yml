name: Testes do site

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  testes:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Instalar dependências
        run: python -m pip install -r requirements-dev.txt

      - name: Lint (erros reais, como nomes indefinidos)
        run: python -m ruff check app.py modules pages tests tools --select F

      - name: Testes automatizados (sem credenciais do Earth Engine)
        run: python -m pytest -q

      - name: A HOME abre sem erros
        run: |
          python - <<'EOF'
          import os
          from streamlit.testing.v1 import AppTest
          at = AppTest.from_file(os.path.abspath("app.py"), default_timeout=120).run()
          assert not at.exception, at.exception
          labels = [t.label for t in at.tabs]
          print("Abas da HOME:", labels)
          assert len(labels) == 3, labels
          EOF
